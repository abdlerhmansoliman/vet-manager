$kind: http-request
url: "{{base_url}}/api/v1/inventory/products"
method: POST
headers:
  Accept: application/json
  X-Tenant-ID: "{{tenant_id}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "name": "Meloxicam Oral Suspension 1.5mg/ml",
        "sku": "MELOX-0BFFAD",
        "base_unit": "ml",
        "is_controlled": false,
        "reorder_threshold": 50,
        "package_description": "100ml amber bottle with dosing syringe",
        "packaging_factor": 100
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
order: 2000
