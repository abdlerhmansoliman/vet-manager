$kind: http-request
name: Waste / Spoilage Stock (with Idempotency)
url: "{{base_url}}/api/v1/inventory/waste"
method: POST
headers:
  Accept: application/json
  X-Tenant-ID: "{{tenant_id}}"
  Content-Type: application/json
  Idempotency-Key: idemp-waste-e596ffa72f63064c
body:
  type: json
  content: |-
    {
        "product_id": "{{product_id}}",
        "quantity": 0.5,
        "reason": "Container seal broken during transit"
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
order: 6000
