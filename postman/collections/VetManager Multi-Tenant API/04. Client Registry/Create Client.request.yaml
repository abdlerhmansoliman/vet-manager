$kind: http-request
url: "{{base_url}}/api/v1/clients"
method: POST
headers:
  Accept: application/json
  X-Tenant-ID: "{{tenant_id}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "client_type": "individual",
        "name": "Jonathan Davis",
        "phone_primary": "+1-555-0144",
        "contact_person": "Jonathan",
        "phone_secondary": "+1-555-0145",
        "physical_address": "742 Evergreen Terrace, Springfield",
        "notes": "Preferred contact via WhatsApp or SMS"
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
order: 2000
