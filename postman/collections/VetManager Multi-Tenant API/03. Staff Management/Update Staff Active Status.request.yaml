$kind: http-request
url: "{{base_url}}/api/v1/staff/{{staff_id}}/status"
method: PATCH
headers:
  Accept: application/json
  X-Tenant-ID: "{{tenant_id}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "is_active": true
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
order: 6000
