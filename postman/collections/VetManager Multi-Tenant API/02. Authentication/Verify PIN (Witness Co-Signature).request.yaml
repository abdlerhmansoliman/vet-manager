$kind: http-request
url: "{{base_url}}/api/v1/auth/verify-pin"
method: POST
headers:
  Accept: application/json
  X-Tenant-ID: "{{tenant_id}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "witness_email": "john.miller@alphavet.com",
        "pin": "1234"
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
order: 3000
