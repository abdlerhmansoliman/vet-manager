$kind: http-request
url: "{{base_url}}/api/v1/auth/login"
method: POST
headers:
  Accept: application/json
  X-Tenant-ID: "{{tenant_id}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "email": "{{email}}",
        "password": "{{password}}",
        "device_name": "{{device_name}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 (Login Successful)", function () {
          pm.response.to.have.status(200);
      });

      if (pm.response.code === 200) {
          const data = pm.response.json();
          if (data.token) {
              pm.environment.set("token", data.token);
              pm.collectionVariables.set("token", data.token);
              console.log("✅ Token successfully stored:", data.token);
          }
          if (data.user && data.user.id) {
              pm.environment.set("staff_id", data.user.id);
              pm.collectionVariables.set("staff_id", data.user.id);
              console.log("👤 Logged in as:", data.user.name, "(" + data.user.email + ")");
          }
          if (data.tenant && data.tenant.slug) {
              pm.environment.set("tenant_id", data.tenant.slug);
              pm.collectionVariables.set("tenant_id", data.tenant.slug);
          }
      } else {
          console.error("❌ Login failed:", pm.response.status, pm.response.text());
      }
    language: text/javascript
order: 1000
