services:
  app:
    build:
      context: ./docker
      dockerfile: Dockerfile
      args:
        UID: 1000
        GID: 1000
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      DB_DATABASE: vet-manage
      DB_USERNAME: abdelrhaman
      DB_PASSWORD: 12345678
      REDIS_HOST: redis
      REDIS_PORT: 6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/var/www
    networks:
      - laravel_net

  nginx:
    image: nginx:alpine
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel_net

  redis:
    image: redis:7.2-alpine
    container_name: laravel_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - laravel_net

  minio:
    image: elestio/minio:latest
    container_name: laravel_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioroot
      MINIO_ROOT_PASSWORD: miniosecret
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - laravel_net

networks:
  laravel_net:
    driver: bridge

volumes:
  redis_data:
  minio_data:
